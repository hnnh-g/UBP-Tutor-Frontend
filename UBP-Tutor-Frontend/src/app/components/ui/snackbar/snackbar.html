<div class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none">
  @for (msg of snackbar.messages(); track trackById($index, msg)) {
    <div
      class="flex items-start gap-3 px-4 py-3 rounded-lg shadow-lg text-white pointer-events-auto animate-slide-up"
      [class]="colorFor(msg.type)"
    >
      <span class="mt-0.5 flex-shrink-0 font-bold text-sm">{{ iconFor(msg.type) }}</span>
      <p class="text-sm flex-1 leading-snug">{{ msg.message }}</p>
      <button
        (click)="snackbar.dismiss(msg.id)"
        class="flex-shrink-0 opacity-75 hover:opacity-100 transition-opacity ml-1"
        aria-label="Dismiss"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  }
</div>
