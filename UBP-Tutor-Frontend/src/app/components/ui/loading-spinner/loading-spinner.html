@if (overlay) {
  <div class="fixed inset-0 bg-white/80 backdrop-blur-sm z-50 flex items-center justify-center">
    <div class="flex flex-col items-center gap-3">
      <svg class="animate-spin text-brand-600" [class]="sizeClass" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
      </svg>
      @if (label) {
        <span class="text-sm text-slate-600">{{ label }}</span>
      }
    </div>
  </div>
} @else {
  <div class="flex items-center gap-2">
    <svg class="animate-spin text-brand-600" [class]="sizeClass" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
    </svg>
    @if (label) {
      <span class="text-sm text-slate-600">{{ label }}</span>
    }
  </div>
}
