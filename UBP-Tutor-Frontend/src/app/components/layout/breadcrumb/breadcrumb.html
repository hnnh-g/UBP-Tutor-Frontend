<nav class="flex items-center gap-1 text-sm text-slate-500 px-6 py-3 border-b border-slate-200 bg-white">
  @for (crumb of crumbs(); track crumb.url; let last = $last) {
    @if (!last) {
      <a [routerLink]="crumb.url" class="hover:text-brand-600 transition-colors">{{ crumb.label }}</a>
      <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
      </svg>
    } @else {
      <span class="text-slate-800 font-medium">{{ crumb.label }}</span>
    }
  }
</nav>
