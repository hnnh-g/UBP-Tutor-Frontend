<div class="flex gap-3 animate-fade-in" [class.flex-row-reverse]="isUser">

  <!-- Avatar -->
  <div
    class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 mt-1"
    [class.bg-brand-600]="isUser"
    [class.bg-slate-200]="!isUser"
  >
    @if (isUser) {
      <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
      </svg>
    } @else {
      <span class="text-slate-600 text-xs font-bold">{{ taskIcon }}</span>
    }
  </div>

  <!-- Bubble -->
  <div class="flex flex-col gap-1 max-w-[75%]" [class.items-end]="isUser">

    <!-- Content -->
    <div
      class="rounded-2xl px-4 py-3 text-sm leading-relaxed"
      [class.bg-brand-600]="isUser"
      [class.text-white]="isUser"
      [class.rounded-tr-sm]="isUser"
      [class.bg-white]="!isUser"
      [class.text-slate-800]="!isUser"
      [class.shadow-sm]="!isUser"
      [class.border]="!isUser"
      [class.border-slate-200]="!isUser"
      [class.rounded-tl-sm]="!isUser"
    >
      @if (!isUser && message.isStreaming && !message.content) {
        <app-typing-indicator />
      } @else {
        <div [innerHTML]="formatContent(message.content)" class="prose-chat"></div>
      }

      <!-- File attachment badge -->
      @if (message.uploadedFile) {
        <div class="mt-2 flex items-center gap-2 text-xs opacity-80">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
          </svg>
          {{ message.uploadedFile.name }}
        </div>
      }
    </div>

    <!-- Time -->
    <span class="text-xs text-slate-400 px-1">{{ formattedTime }}</span>
  </div>
</div>
