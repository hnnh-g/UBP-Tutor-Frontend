<div #scrollContainer class="flex-1 overflow-y-auto px-4 py-6 space-y-4">

  @if (chat.messages().length === 0) {
    <!-- Empty State -->
    <div class="flex flex-col items-center justify-center h-full text-center py-16">
      <div class="w-16 h-16 bg-brand-100 rounded-2xl flex items-center justify-center mb-4">
        <svg class="w-8 h-8 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
        </svg>
      </div>
      <h3 class="text-lg font-semibold text-slate-800 mb-2">
        {{ translation.t().tutor.emptyState.title }}
      </h3>
      <p class="text-sm text-slate-500 max-w-sm">
        {{ translation.t().tutor.emptyState.subtitle }}
      </p>

      <!-- Suggestion chips -->
      <div class="mt-6 flex flex-wrap gap-2 justify-center max-w-lg">
        @for (suggestion of translation.t().tutor.emptyState.suggestions; track suggestion) {
          <span class="text-xs px-3 py-1.5 bg-white border border-slate-200 rounded-full text-slate-600 shadow-sm">
            {{ suggestion }}
          </span>
        }
      </div>
    </div>
  } @else {
    @for (msg of chat.messages(); track msg.id) {
      <app-message-bubble [message]="msg" />
    }
  }
</div>
